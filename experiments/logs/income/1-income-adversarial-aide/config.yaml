desc_file: null
goal: Predict PINCP using adversarial debiasing to minimize demographic parity difference
  between racial groups (RAC1P) while maintaining high accuracy. Train two neuarl
  networks simultaneously in a min-max game, the predictor tries to predict the target
  (PINCP) accurately, and the adversary tries to predict the sensitive attribue (Race)
  based only on predictors output (or hiddgen state). The predictor tries to minimize
  its own classification error minus the Adversary's ability to guess the sensitive
  attribute.
eval: Balanced accuracy and fairness. Report accuracy, demographic parity difference
  (lower is better), and equalized odds difference (lower is better). Success if accuracy
  > 0.78 and demographic parity difference < 0.05 while maintaining these fairness
  metrics.
