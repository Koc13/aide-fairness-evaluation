 the full training set and generate predictions for the test set,\nsaving them to `working/submission.csv`.", "I will train a LightGBM classifier on one\u2010hot encoded categorical features and\nraw numerical features, since tree models handle unscaled inputs well. I will\nevaluate using 5\u2010fold stratified cross\u2010validation to report mean accuracy.\nFinally, I will retrain the model on the full training data and generate\npredictions for the test set, saving them to `working/submission.csv`. This\napproach leverages a fast gradient boosting algorithm without extensive tuning\nfor a baseline strong performance.", "We will use an XGBoost classifier which often provides strong performance on\ntabular data. We load the data and one-hot encode categorical features while\nretaining raw numerical features. We perform 5-fold stratified cross-validation\nto estimate validation accuracy. After reporting mean CV accuracy, we retrain on\nthe full training set and generate predictions on the test set. Finally, we save\nthe test predictions to `working/submission.csv`.", "We can replace the unavailable XGBoost classifier with scikit\u2010learn\u2019s\nRandomForestClassifier to avoid the ModuleNotFoundError. We\u2019ll split the\ntraining data into a train and hold\u2010out validation set, build a preprocessing\npipeline with one\u2010hot encoding for categoricals and scaling for numericals,\ntrain the RandomForest, and print the validation accuracy. Finally, we\u2019ll\nretrain on the full training data, predict on the test set, and save the\nsubmission.csv.", "I replaced XGBoost with a scikit-learn RandomForestClassifier since xgboost is\nnot available. The script reads train/test, one-hot encodes categoricals, aligns\nfeatures, and runs stratified 5-fold CV to compute and print the mean accuracy.\nFinally it retrains on the full training set, predicts on the test set, and\nsaves `submission.csv` in `./working`.", "I will perform a randomized hyperparameter search over d save them as `submission.csv`.", "We can improve performance by replacing one\u2010hot encoding with LightGBM\u2019s native\ncategorical feature support and adding early stopping to prevent overfitting.\nSpecifically, we convert object columns to pandas categorical dtype and let\nLightGBM detect them, which reduces dimensionality and leverages optimized split\nfinding. We then perform an 80/20 stratified split, train with early stopping on\nthe hold\u2010out set to pick the best number of iterations, and print validation\naccuracy. Finally, we retrain with the optimal number of trees on the full\ndataset and generate the submission file.", "We can fix the TypeError by removing the unsupported early_stopping_rounds\nargument from LGBMClassifier.fit and instead passing LightGBM\u2019s early stopping\ncallback via the callbacks parameter. We import early_stopping (and optionally\nsuppress logs with log_evaluation) from lightgbm and then call model.fit(...,\ncallbacks=[early_stopping(stopping_rounds=50), log_evaluation(period=0)]). The\nrest of the pipeline\u2014data loading, categorical handling, train/validation split,\nevaluation, retraining, and submission creation\u2014remains unchanged.", "We can fix the error by removing the unsupported `verbose` argument from the\nfinal `fit` call and rely on the default logging or callbacks to control output.\nEverything else remains the same: load and preprocess the data, perform a\nstratified train/validation split, train with early stopping, evaluate on the\nhold-out set, then retrain on the full training data using the best iteration\nand save the test set predictions.", "I will drop the target column from the test set before encoding to ensure\nfeature alignment, then split the training data into a train/validation hold\u2010out\nset. I\u2019ll fit a RandomizedSearchCV on the training split, evaluate on the\nhold\u2010out set and print its accuracy, then retrain the best model on the full\ntraining data and generate a submission file.", "We can enrich the model by adding pairwise interaction features between numeric\npredictors using sklearn\u2019s PolynomialFeatures (degree=2, interaction_only=True).\nThis will allow LightGBM to capture combined effects like GRE\u00d7CGPA without\nmanual engineering. We then proceed with the same hyperparameter search and\n5\u2010fold stratified CV to find the best model. Finally, we refit on the full\ntraining data and generate test predictions.", "We should ensure the full training and test sets are encoded before any LightGBM\nfitting to avoid object dtypes. Fitting the OrdinalEncoder on the entire\ntraining set and transforming both the train and test sets upfront guarantees\nconsistency and that all features are numeric. We then split the encoded\ntraining data for hyperparameter search and validation, print the validation\naccuracy, retrain the best model on the fully encoded data, and finally save\ntest predictions to `submission.csv`. This fixes the dtype error by never\npassing object columns to LightGBM.", "I will augment the numeric features by generating degree-2 polynomial and\ninteraction terms, enabling LightGBM to capture non-linear relationships and\nfeature interactions. Specifically, I\u2019ll fit a PolynomialFeatures transformer on\nthe training numeric columns, transform both train and test sets, then one-hot\nencode categoricals and align features. Finally, I\u2019ll run the same randomized\nhyperparameter search with 5-fold CV, print the best CV accuracy, retrain on the\nfull data and save the test predictions.", "I will extend the LightGBM hyperparameter search space by adding L1\n(`reg_alpha`) and L2 (`reg_lambda`) regularization parameters, and increase the\nnumber of iterations to 30 in `RandomizedSearchCV`. This should help control\noverfitting and improve generalization performance. I will then run 5-fold\nstratified cross-validation, print the best CV accuracy, retrain the best model\non the full dataset, and save the let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
