  for constraint-based training, GridSearch with fairness constraints, or per-group
  calibration. Remove sensitive features during training but use them for fairness
  evaluation and post-processing.
eval: balanced metric combining accuracy and fairness violations with targets of demographic
  parity below 0.15 and equal opportunity below 0.10
