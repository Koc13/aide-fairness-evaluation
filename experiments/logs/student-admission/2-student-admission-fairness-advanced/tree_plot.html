let treeStructData = {"edges": [[0, 8], [0, 5], [0, 19], [0, 18], [0, 17], [0, 15], [1, 6], [2, 13], [3, 10], [4, 9], [6, 7], [8, 12], [10, 11], [12, 16], [13, 14]], "layout": [[0.2777777777777778, 0.0], [0.6666666666666666, 0.0], [0.7777777777777778, 0.0], [0.8888888888888888, 0.0], [1.0, 0.0], [0.0, 0.33333333333333337], [0.6666666666666666, 0.33333333333333337], [0.6666666666666666, 0.6666666666666667], [0.1111111111111111, 0.33333333333333337], [1.0, 0.33333333333333337], [0.8888888888888888, 0.33333333333333337], [0.8888888888888888, 0.6666666666666667], [0.1111111111111111, 0.6666666666666667], [0.7777777777777778, 0.33333333333333337], [0.7777777777777778, 0.6666666666666667], [0.2222222222222222, 0.33333333333333337], [0.1111111111111111, 1.0], [0.3333333333333333, 0.33333333333333337], [0.4444444444444444, 0.33333333333333337], [0.5555555555555556, 0.33333333333333337]], "plan": ["We train a logistic regression on non-sensitive features and apply\nExponentiatedGradient with a DemographicParity constraint (\u03b5=0.15) to enforce\ndemographic parity. We split off 20% of the training data for validation, then\nmeasure accuracy, demographic parity difference and true positive rate\ndifference (equal opportunity) across race, gender, and socioeconomic status. We\ncompute a final score by subtracting any fairness violations beyond the targets\n(0.15 for DP, 0.10 for EO) from accuracy. Finally, we predict on the test set\nand save the admissions predictions to submission.csv.", "We train a lightGBM classifier on non-sensitive features and wrap it in a\nFairlearn ExponentiatedGradient reduction with an EqualizedOdds constraint\n(\u03b5=0.10) over the combined sensitive attributes (race, gender,\nsocioeconomic_status).  We preprocess numeric features with standard scaling and\nremaining categoricals with one-hot encoding, then split off 20% of the training\ndata for validation.  After fitting, we compute accuracy, demographic parity\ndifference and true positive rate difference on the validation set and report a\ncombined metric of accuracy minus penalties for any DP>0.15 or EO>0.10.\nFinally, we predict on the test set and save the results in submission.csv.", "We will train an XGBoost classifier on all non\u2010sensitive features to capture\nnonlinear relationships and then wrap it with Fairlearn\u2019s ExponentiatedGradient\nusing an EqualizedOdds constraint (\u03b5=0.10) to enforce true positive rate parity\nacross race, gender, and socioeconomic_status. We hold out 20% of the training\nset for validation, measure accuracy, demographic parity difference, and equal\nopportunity difference, and compute a combined metric that penalizes any\nfairness violation beyond DP\u22640.15 and EO\u22640.10. Finally, we predict on the test\nset and save the results to submission.csv.", "We train a logistic regression on non\u2010sensitive features, then apply Fairlearn\u2019s\nThresholdOptimizer to enforce demographic parity with \u03b5=0.15 across combined\nrace\u2010gender\u2010SES groups. We hold out 20% of the training data to compute\naccuracy, demographic parity difference, and equal opportunity difference, and\ncalculate a final score by subtracting any fairness violations beyond DP\u2009=\u20090.15\nand EO\u2009=\u20090.10 from accuracy. We then retrain on the full training set and\ngenerate test predictions, saving them to submission.csv. The evaluation metric\nprinted is accuracy minus fairness\u2010violation penalty.", "We will train a logistic regression on the non\u2010sensitive features using a\npreprocessing pipeline that one\u2010hot encodes categorical variables. Then we apply\nFairlearn\u2019s ThresholdOptimizer with the \u201cequalized_odds\u201d constraint over the\ncombined sensitive features (race, gender, socioeconomic_status) to balance true\nand false positive rates, indirectly controlling demographic parity. We split\noff a validation set to fit the threshold optimizer and compute accuracy,\ndemographic parity difference, and true positive rate difference across race,\ngender, and socioeconomic status. Our evaluation metric is accuracy minus any\nexcess fairness violations (max(dp\u22120.15, 0)+max(eo\u22120.10, 0)). Finally we retrain\non the full training data, predict on the test set, print the validation metric,\nand save the test admissions predictions to submission.csv.", "We replace the DemographicParity constraint with an EqualizedOdds constraint in\nExponentiatedGradient, setting the bound to 0.10 to directly enforce equal\nopportunity parity while also controlling false positive rate differences. This\nchange should reduce the true positive rate disparity below the 0.10 target. The\nrest of the pipeline remains identical, keeping logistic regression as the base\nlearner and using the same train/validation split and metric calculations.", "We need to tell ExponentiatedGradient to forward sample weights to the\nclassifier step in our pipeline by using the `sample_weight_name` argument. By\nsetting `sample_weight_name=\"clf__sample_weight\"`, the sample weights computed\ninternally will be passed correctly to `LGBMClassifier`. The rest of the\ntraining, validation, fairness evaluation, and test-set prediction logic remains\nthe same, and we save the final predictions to `working/submission.csv`.", "I will fix the ExponentiatedGradient initialization by using the correct\n`estimator` argument instead of `base_estimator` so it matches the Fairlearn\nAPI. The rest of the pipeline\u2014including preprocessing, fitting with sensitive\nfeatures, and computing demographic parity and equal opportunity\ndifferences\u2014remains the same. After training, the code prints out the combined\nvalidation score and saves test predictions to `./working/submission.csv`. This\nchange resolves the TypeError and ensures the model runs as intended.", "We can improve fairness by using a post-processing ThresholdOptimizer that\nenforces equalized odds, which directly targets equal opportunity differences\nwhile controlling false positive rate disparity. We will train a standard\nlogistic regression on non-sensitive features, then fit the ThresholdOptimizer\non a validation split using a single composite sensitive feature combining race,\ngender, and socioeconomic status. This approach adjusts decision thresholds per\ngroup to satisfy fairness constraints without retraining the classifier.\nFinally, we will evaluate accuracy, demographic parity difference, equal\nopportunity difference on the validation set, compute the combined score, and\ngenerate test predictions.", "I will filter out groups of sensitive-feature combinations in the validation set\n(and later in the full training set) that have only one class label, so that the\nThresholdOptimizer never encounters degenerate groups. After fitting on only the\nnon-degenerate groups, I\u2019ll predict for all rows and compute the combined score,\nthen retrain on the full filtered data before generating final test predictions\nand saving `submission.csv`.", "We update the OneHotEncoder instantiation to use `sparse_output=False` instead\nof the deprecated `sparse` argument for compatibility with newer scikit-learn.\nThe rest of the pipeline, including ThresholdOptimizer post\u2010processing, remains\nthe same: we split off a validation set, fit the preprocessor and fairlearn\noptimizer, compute demographic parity and equal opportunity differences to form\na final score, then retrain on all data and output `submission.csv`. This\nensures the TypeError is resolved and the evaluation metric is printed.", "We detect composite sensitive groups in the training split that only have one\nclass of the target, and we merge them into a \u201creference\u201d group that has both\nclasses.  We then replace all degenerate groups in train, validation,\nfull\u2010training, and test with that reference group before fitting\nThresholdOptimizer, which prevents the degenerate\u2010labels error.  Finally, we\ncompute accuracy minus penalties for demographic parity and equal opportunity on\nrace, gender, and SES, print the validation score, and output the test\nsubmission.", "We reduce sparsely populated composite groups by mapping those with fewer than\n50 training samples to a single \u201cOther\u201d group. This ensures each sensitive\nsubgroup has both positive and negative labels when fitting the\nThresholdOptimizer. We then proceed with one\u2010hot encoding, train/validation\nsplit (including original sensitive columns for fairness evaluation), fit a\nlogistic regression base learner followed by ThresholdOptimizer under equalized\nodds, and finally evaluate accuracy, demographic parity difference, and equal\nopportunity difference on the full validation set before saving test\npredictions.", "We replace XGBClassifier with sklearn\u2019s LogisticRegression to eliminate the\nxgboost dependency. The ExponentiatedGradient with EqualizedOdds is fitted on a\nhold\u2010out split, and we compute demographic parity and equal opportunity\ndifferences to enforce the fairness thresholds. We then print the combined\nmetric and save test predictions to submission.csv.", "We can fix this by dropping the `sensitive_features` argument from the `predict`\ncalls, since `ExponentiatedGradient.predict()` does not accept it. Instead, we\nsimply call `predict(X_val)` and `predict(X_test_enc)` on the mitigator, then\nuse our held\u2010out `sens_val` and `sens_test` for fairness evaluation. This small\nchange ensures compatibility with the Fairlearn API and preserves our metric\ncalculations. Finally, we generate and save the final submission.", "I will perform a small hyperparameter search over the logistic regression\nregularization strength C by fitting ExponentiatedGradient with\nDemographicParity constraint (\u03b5=0.15) for each candidate, and select the C that\nmaximizes our validation combined score (accuracy minus fairness\u2010violation\npenalties). Then I will retrain the mitigator on the full training data using\nthe best C before generating test predictions. This should yield a better\ntrade\u2010off between accuracy and fairness.", "I fixed the degenerate\u2010labels error by dropping the composite group and using\nonly \u201crace\u201d as the sensitive feature for threshold optimization, since race\ngroups are large enough to contain both classes. We now train on the same\nfeatures, fit ThresholdOptimizer on validation data using race only, and still\nevaluate fairness across race, gender, and SES. Finally we compute and print\naccuracy, DP and EO differences, the combined score on validation, and write the\ntest submission.", "I propose replacing the DemographicParity constraint with an EqualizedOdds\nconstraint (difference_bound=0.10) in the ExponentiatedGradient mitigator to\ndirectly enforce equal opportunity parity (TPR differences \u22640.10) across race,\ngender, and socioeconomic_status. This single change should reduce the true\npositive rate disparities while retaining reasonable accuracy. We refit the\nmitigator with this constraint, evaluate accuracy, demographic parity\ndifference, and equal opportunity difference on the validation split, and then\ngenerate test predictions for submission.", "I will switch the fairness constraint from demographic parity to equalized odds\nwith a strict difference bound of 0.10, and increase the number of iterations in\nthe ExponentiatedGradient mitigator to 100 to give it more opportunity to\nconverge. This directly targets true positive rate (equal opportunity) and false\npositive rate parity while still balancing accuracy. All other preprocessing,\nsplitting, evaluation, and the final submission step remain unchanged to isolate\nthe effect of this single change.", "I will perform a hyperparameter search over the logistic\u2010regression\nregularization strength C within an ExponentiatedGradient mitigator using an\nEqualizedOdds constraint bound at 0.10. For each candidate C, I will fit the\nmitigator on the training split, evaluate the combined score (accuracy minus\nfairness\u2010violation penalties) on the validation split, and select the best C.\nFinally, I will use the best mitigator to predict on the test set and save the\nsubmission."], "code": ["import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import accuracy_score\nfrom fairlearn.reductions import ExponentiatedGradient, DemographicParity\nfrom fairlearn.metrics import (\n    demographic_parity_difference,\n    true_positive_rate_difference,\n)\n\n# Load data\ntrain = pd.read_csv(\"input/train.csv\")\ntest = pd.read_csv(\"input/test.csv\")\n\nsensitive_cols = [\"race\", \"gender\", \"socioeconomic_status\"]\n\n# Prepare features and labels\ny = train[\"admitted\"]\nX = train.drop(columns=[\"admitted\"] + sensitive_cols)\nX_test = test.drop(columns=[\"admitted\"] + sensitive_cols)\nS = train[sensitive_cols].astype(str)\nS_test = test[sensitive_cols].astype(str)\n\n# One-hot encode non-sensitive categorical features\nX = pd.get_dummies(X, drop_first=True)\nX_test = pd.get_dummies(X_test, drop_first=True)\nX_test = X_test.reindex(columns=X.columns, fill_value=0)\n\n# Split for validation\nX_train, X_val, y_train, y_val, S_train, S_val = train_test_split(\n    X, y, S, test_size=0.2, random_state=42, stratify=y\n)\n\n# Fit ExponentiatedGradient with DemographicParity constraint\nbase_est = LogisticRegression(solver=\"liblinear\", max_iter=1000, random_state=42)\nconstraint = DemographicParity(difference_bound=0.15)\nmitigator = ExponentiatedGradient(base_est, constraint, max_iter=50)\nmitigator.fit(X_train, y_train, sensitive_features=S_train)\n\n# Validate\ny_pred_val = mitigator.predict(X_val)\nacc = accuracy_score(y_val, y_pred_val)\n\n# Compute fairness metrics for each sensitive feature\ndp_vals = [\n    demographic_parity_difference(y_val, y_pred_val, sensitive_features=S_val[col])\n    for col in sensitive_cols\n]\neo_vals = [\n    true_positive_rate_difference(y_val, y_pred_val, sensitive_features=S_val[col])\n    for col in sensitive_cols\n]\ndp_max = max(dp_vals)\neo_max = max(eo_vals)\n\n# Final score penalizes violations beyond targets\nfinal_score = acc - max(0, dp_max - 0.15) - max(0, eo_max - 0.10)\n\nprint(f\"Validation Accuracy: {acc:.4f}\")\nprint(f\"Demographic Parity Difference: {dp_max:.4f}\")\nprint(f\"Equal Opportunity Difference: {eo_max:.4f}\")\nprint(f\"Final Combined Score: {final_score:.4f}\")\n\n# Predict on test and save submission\ny_pred_test = mitigator.predict(X_test)\nsubmission = pd.DataFrame({\"admitted\": y_pred_test})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.pipeline import Pipeline\nfrom lightgbm import LGBMClassifier\nfrom fairlearn.reductions import ExponentiatedGradient, EqualizedOdds\nfrom fairlearn.metrics import (\n    demographic_parity_difference,\n    true_positive_rate_difference,\n)\nfrom sklearn.metrics import accuracy_score\n\n# Load data\ntrain_df = pd.read_csv(\"./input/train.csv\")\ntest_df = pd.read_csv(\"./input/test.csv\")\n\n# Define features\nsensitive_cols = [\"race\", \"gender\", \"socioeconomic_status\"]\ndrop_cols = sensitive_cols + [\"admitted\"]\nX = train_df.drop(columns=drop_cols)\ny = train_df[\"admitted\"]\nXs_test = test_df.drop(columns=drop_cols)\n# Hold out 20% for validation\nX_train, X_val, y_train, y_val, sens_train, sens_val = train_test_split(\n    X, y, train_df[sensitive_cols], test_size=0.2, stratify=y, random_state=42\n)\n\n# Preprocessing\nnumeric_features = X.select_dtypes(include=[\"int64\", \"float64\"]).columns.tolist()\ncategorical_features = X.select_dtypes(include=[\"object\"]).columns.tolist()\npreprocessor = ColumnTransformer(\n    [\n        (\"num\", StandardScaler(), numeric_features),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), categorical_features),\n    ]\n)\n\n# Base estimator pipeline\nbase_clf = Pipeline(\n    [(\"pre\", preprocessor), (\"clf\", LGBMClassifier(n_estimators=100, random_state=42))]\n)\n\n# Fairness-aware training with EqualizedOdds\nexpgrad = ExponentiatedGradient(base_clf, constraints=EqualizedOdds(), eps=0.10)\nexpgrad.fit(X_train, y_train, sensitive_features=sens_train)\n\n# Validation predictions\ny_pred = expgrad.predict(X_val)\ndp_diff = demographic_parity_difference(y_val, y_pred, sensitive_features=sens_val)\neo_diff = true_positive_rate_difference(y_val, y_pred, sensitive_features=sens_val)\nacc = accuracy_score(y_val, y_pred)\n# Combined metric\nmetric = acc - max(0, dp_diff - 0.15) - max(0, eo_diff - 0.10)\nprint(f\"Validation combined score: {metric:.4f}\")\n\n# Predict on test set and save submission\ntest_preds = expgrad.predict(Xs_test)\nsubmission = pd.DataFrame({\"admitted\": test_preds}, index=test_df.index)\nsubmission.to_csv(\"./working/submission.csv\", index=True)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.metrics import accuracy_score\nfrom fairlearn.reductions import ExponentiatedGradient, EqualizedOdds\nfrom fairlearn.metrics import demographic_parity_difference, true_positive_rate\nfrom xgboost import XGBClassifier\n\n# Load data\ntrain_df = pd.read_csv(\"./input/train.csv\")\ntest_df = pd.read_csv(\"./input/test.csv\")\n\n# Sensitive features\nsens_feats = [\"race\", \"gender\", \"socioeconomic_status\"]\ny = train_df[\"admitted\"]\nX = train_df.drop(columns=sens_feats + [\"admitted\"])\nX_test = test_df.drop(columns=sens_feats + [\"admitted\"])\n\n# One\u2010hot encode non\u2010sensitive categoricals\nX_full = pd.get_dummies(X)\nX_test_enc = pd.get_dummies(X_test)\nX_full, X_test_enc = X_full.align(X_test_enc, join=\"left\", axis=1, fill_value=0)\n\n# Split for validation\nsens = train_df[sens_feats]\nX_train, X_val, y_train, y_val, sens_train, sens_val = train_test_split(\n    X_full, y, sens, test_size=0.2, stratify=y, random_state=42\n)\n\n# Base classifier\nbase_clf = XGBClassifier(\n    use_label_encoder=False, eval_metric=\"logloss\", n_estimators=50, random_state=42\n)\n\n# Fairness\u2010aware wrapper\nmitigator = ExponentiatedGradient(\n    estimator=base_clf, constraints=EqualizedOdds(), eps=0.10\n)\nmitigator.fit(X_train, y_train, sensitive_features=sens_train)\n\n# Validation predictions\ny_pred_val = mitigator.predict(X_val, sensitive_features=sens_val)\n\n# Compute metrics\nacc = accuracy_score(y_val, y_pred_val)\ndp_g = demographic_parity_difference(\n    y_val, y_pred_val, sensitive_features=sens_val[\"gender\"]\n)\ndp_r = demographic_parity_difference(\n    y_val, y_pred_val, sensitive_features=sens_val[\"race\"]\n)\ndp_s = demographic_parity_difference(\n    y_val, y_pred_val, sensitive_features=sens_val[\"socioeconomic_status\"]\n)\nDP_diff = max(abs(dp_g), abs(dp_r), abs(dp_s))\n\n\n# Equal opportunity (TPR difference)\ndef eo_diff(sf):\n    groups = sf.unique()\n    tprs = [true_positive_rate(y_val[sf == g], y_pred_val[sf == g]) for g in groups]\n    return max(tprs) - min(tprs)\n\n\neo_g = eo_diff(sens_val[\"gender\"])\neo_r = eo_diff(sens_val[\"race\"])\neo_s = eo_diff(sens_val[\"socioeconomic_status\"])\nEO_diff = max(eo_g, eo_r, eo_s)\n\n# Combined metric\nmetric = acc - max(0, DP_diff - 0.15) - max(0, EO_diff - 0.10)\nprint(f\"Validation metric: {metric:.4f}\")\n\n# Predict on test and save submission\nsens_test = test_df[sens_feats]\ny_pred_test = mitigator.predict(X_test_enc, sensitive_features=sens_test)\nsubmission = pd.DataFrame({\"id\": test_df.index, \"admitted\": y_pred_test})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardSc let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
