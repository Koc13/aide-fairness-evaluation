let treeStructData = {"edges": [[1, 6], [3, 7], [3, 5], [4, 8], [7, 11], [7, 10], [7, 9], [11, 12], [12, 14], [12, 13], [13, 17], [14, 16], [14, 18], [14, 19], [14, 15]], "layout": [[0.0, 0.0], [0.13793103448275862, 0.0], [0.27586206896551724, 0.0], [0.41379310344827586, 0.0], [0.6206896551724138, 0.0], [0.3448275862068966, 0.19999999999999996], [0.13793103448275862, 0.19999999999999996], [0.4827586206896552, 0.19999999999999996], [0.6206896551724138, 0.19999999999999996], [0.3448275862068966, 0.4], [0.4827586206896552, 0.4], [0.6206896551724138, 0.4], [0.6206896551724138, 0.6], [0.4482758620689655, 0.8], [0.7931034482758621, 0.8], [0.5862068965517241, 1.0], [0.7241379310344828, 1.0], [0.4482758620689655, 1.0], [0.8620689655172413, 1.0], [1.0, 1.0]], "plan": ["We will one-hot encode all categorical variables and train a LightGBM classifier\nusing default parameters to jointly predict admission. We evaluate performance\nvia 5-fold cross-validation computing accuracy and the average demographic\nparity gap across race, gender, and socioeconomic status. We define a composite\nmetric as accuracy minus the average parity gap to balance accuracy and\nfairness. Finally, we train the model on the full training data and generate\ntest set predictions for a submission file.", "We will ordinally encode all categorical variables and train an XGBoost\nclassifier with default settings. We evaluate with 5-fold stratified\ncross\u2010validation, computing accuracy and the equal opportunity gap (difference\nin true positive rates) across race, gender, and socioeconomic status. Our\ncomposite metric is accuracy minus the average equal opportunity gap to\nencourage fairness. Finally, we train on the full dataset and generate test\npredictions for a submission.csv file.", "We exclude protected attributes from inputs and train a logistic regression with\nL2 regularization on the remaining features. Numeric features are scaled and\ncategoricals one-hot encoded in a pipeline. We evaluate under 5-fold stratified\nCV, computing accuracy and the equal opportunity gap (max\u2013min TPR) for each\nprotected attribute, averaging these gaps, and defining a composite metric as\naccuracy minus mean equal opportunity gap. Finally, we retrain on all data and\nsave test set predictions to submission.csv.", "I will train a RandomForestClassifier on one-hot encoded categorical and scaled\nnumeric features, excluding protected attributes from the inputs. I'll perform\n5-fold stratified cross-validation, computing accuracy and the equalized odds\ngap (the larger of TPR and FPR differences) across race, gender, and\nsocioeconomic groups, and define a composite metric as accuracy minus this\naverage gap. Finally, I'll retrain on the full training set and output\npredictions on the test set in submission.csv. This approach balances predictive\nperformance with fairness by penalizing both types of classification disparity.", "We one-hot encode non-protected categorical features and exclude race, gender,\nand socioeconomic_status from the inputs to mitigate bias. We train an XGBoost\nclassifier with default settings and evaluate via 5-fold stratified cross-\nvalidation, computing accuracy and the equal opportunity gap (difference between\nmax and min true positive rates) across each protected attribute. We define a\ncomposite metric as accuracy minus the average equal opportunity gap to balance\nperformance and fairness. Finally, we retrain on the full training set and\noutput test set predictions to submission.csv.", "I will replace the RandomForestClassifier with a LightGBM classifier\n(n_estimators=200, learning_rate=0.05, num_leaves=31) to boost accuracy and\ntraining efficiency while preserving our fairness evaluation. I will integrate\nLightGBM into the existing preprocessing pipeline, rerun 5-fold stratified CV to\ncompute the composite metric (accuracy minus equalized odds gap across race,\ngender, and socioeconomic status), and then retrain on the full training set to\ngenerate the submission file.", "We can resolve the missing xgboost error by using scikit-learn\u2019s\nRandomForestClassifier instead, which is pre-installed. We keep the same data\nloading, encoding, cross-validation, and fairness metric calculations, simply\nswapping out XGBClassifier for RandomForestClassifier. After printing the\ncomposite accuracy-fairness score, we retrain the final model on all data and\noutput test predictions to submission.csv. This maintains the original\nevaluation protocol and ensures the code runs without xgboost.", "I will apply a reweighting pre-processing step to enforce demographic parity: in\neach CV fold I compute sample weights inversely proportional to the observed\njoint distribution of the combined protected group and the target, so that\nlabels become independent of protected groups. These weights are passed to the\nRandomForestClassifier via the pipeline\u2019s fit method. I then evaluate using the\nsame composite metric (accuracy minus equalized odds gap) and finally retrain on\nall data with reweighting to generate test predictions.", "I replaced XGBoost with a RandomForestClassifier, which is available in\nscikit\u2010learn by default, and kept the same cross\u2010validation and fairness metric\ncalculations. We one\u2010hot encode all features except the protected attributes and\nthe target, align train and test feature sets, and perform 5\u2010fold stratified CV\nto compute accuracy and equal\u2010opportunity gaps. Finally, we retrain on the full\ndataset, generate test predictions, save them to `submission.csv` in\n`./working`, and print the composite metric.", "I will clip the reweighting sample weights at the 95th percentile to limit the\ninfluence of very large weights from rare intersectional groups, reducing\nvariance and potential overfitting while retaining fairness benefits. This is an\natomic change to the existing reweighting scheme. I will then run the same\n5\u2010fold CV, compute the composite metric (accuracy minus equalized odds gap), and\nretrain on full data to produce the submission.", "I propose replacing the RandomForestClassifier with a LightGBM gradient boosting\nmodel in our preprocessing pipeline, leveraging its superior predictive\nperformance while still applying our reweighting scheme to enforce fairness.\nWe\u2019ll configure the LGBMClassifier with 200 estimators, a low learning rate, and\nuse stratified 5-fold CV to compute the composite metric (accuracy minus average\nequalized odds gap). Finally, we retrain on the full dataset using the same\nreweighting and output test predictions to submission.csv.", "I will add a post\u2010hoc threshold tuning step in each CV fold where we pick the\nprobability cutoff on the training fold that maximizes the composite metric\n(accuracy minus equalized odds gap), then apply that threshold to the validation\nfold. For the final model, we similarly tune the threshold on the full training\nset before generating test predictions, which should improve the\nfairness\u2010accuracy tradeoff. This is an atomic change that directly optimizes our\nevaluation metric.", "I propose replacing the RandomForestClassifier in our pipeline with a\nLightGBMClassifier configured with 200 estimators and a low learning rate of\n0.05. LightGBM often yields better predictive performance on tabular data while\nstill allowing us to apply our reweighting scheme for fairness. We will retain\nthe reweighting and threshold tuning steps in each CV fold and on the full\ntraining set to optimize the composite metric. This atomic change should boost\naccuracy while maintaining fairness across protected groups.", "We will integrate a fairness\u2010aware post\u2010processing step using Fairlearn\u2019s\nThresholdOptimizer to enforce equalized odds across race, gender, and\nsocioeconomic status. In each CV fold, after training the reweighted LightGBM\npipeline, we fit a ThresholdOptimizer (prefit with predict_proba) on the\ntraining data with sensitive_features set to the protected attributes, and use\nit to adjust predictions on the validation fold. We then compute and print the\ncomposite metric (accuracy minus equalized odds gap) using these adjusted\npredictions. Finally, we retrain on the full dataset, fit the ThresholdOptimizer\non full data, and generate fair test predictions saved to submission.csv.", "I will add an isotonic calibration step on the predicted probabilities within\neach CV fold (using CalibratedClassifierCV with cv='prefit') after fitting the\nweighted LGBM pipeline. Calibrated probabilities should improve the reliability\nof threshold tuning for our composite metric. I will similarly calibrate the\nfinal model on the full training data before generating test predictions.", "I will tune the LightGBM hyperparameters to improve generalization: increase the\nnumber of trees to 500 with a lower learning rate of 0.01, expand the tree\ncomplexity via `num_leaves=64`, and add regularization (`reg_alpha` and\n`reg_lambda` set to 0.1). This atomic change should reduce overfitting and boost\nperformance on unseen data while maintaining our reweighting, calibration, and\nthreshold\u2010tuning pipeline. All other steps remain the same to isolate the effect\nof the hyperparameter adjustment.", "I propose dampening the reweighting extremes by taking the square root of the\ninverse\u2010probability sample weights. This reduces variance from rare\nintersectional groups while still enforcing fairness adjustments. All other\nsteps\u2014including calibration and threshold tuning\u2014remain unchanged so we can\ndirectly measure the impact of this weight transformation.", "We encountered degenerate labels in some small intersectional groups which\ncaused the ThresholdOptimizer to fail, so we first collapse any combination of\nrace, gender, and socioeconomic status that has only a single class in the\ntraining data into a common \u201cOther\u201d group. This guarantees that each group\npassed to the post\u2010processing step has both positive and negative examples. We\napply the same mapping to validation and test sets, then proceed with 5\u2010fold CV\nto compute our composite metric and retrain on the full data, outputting\n`submission.csv`.", "I will add early stopping to the LightGBM training in each CV fold by increasing\nthe number of trees to 500 and using early_stopping_rounds=50 on the validation\nfold. I\u2019ll record each fold\u2019s best iteration and use the average as the final\nmodel\u2019s n_estimators to reduce overfitting. All other steps\u2014reweighting,\ncalibration with isotonic regression, and threshold tuning\u2014remain unchanged.\nThis atomic change should improve generalization and the composite metric.", "I propose switching the calibration step from isotonic to sigmoid (Platt)\nscaling in CalibratedClassifierCV. Sigmoid calibration is less prone to\noverfitting on small datasets and should improve the reliability of predicted\nprobabilities, enhancing our threshold tuning and fairness-accuracy tradeoff.\nThis is a simple atomic change: update the calibration method in both cross-\nvalidation and final model calibration."], "code": ["import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import KFold\nfrom sklearn.metrics import accuracy_score\nimport lightgbm as lgb\n\n# Load data\ntrain_df = pd.read_csv(\"./input/train.csv\")\ntest_df = pd.read_csv(\"./input/test.csv\")\n\n# Features\ntarget = \"admitted\"\ncat_feats = [\n    \"disability_status\",\n    \"first_generation\",\n    \"gender\",\n    \"race\",\n    \"region\",\n    \"socioeconomic_status\",\n    \"urban_rural\",\n]\nnumeric_feats = [\n    c\n    for c in train_df.columns\n    if train_df[c].dtype in [\"int64\", \"float64\"] and c != target\n]\n\n# One-hot encoding\ntrain_dummies = pd.get_dummies(train_df[cat_feats], prefix=cat_feats)\nX_full = pd.concat([train_df[numeric_feats], train_dummies], axis=1).values\ny_full = train_df[target].values\n\n# Prepare test encoding\ntest_dummies = pd.get_dummies(test_df[cat_feats], prefix=cat_feats)\ntest_dummies = test_dummies.reindex(columns=train_dummies.columns, fill_value=0)\nX_test = np.concatenate([test_df[numeric_feats].values, test_dummies.values], axis=1)\n\n# Cross-validation\nkf = KFold(n_splits=5, shuffle=True, random_state=42)\nmetrics = []\nfor train_idx, val_idx in kf.split(X_full):\n    X_tr, X_val = X_full[train_idx], X_full[val_idx]\n    y_tr, y_val = y_full[train_idx], y_full[val_idx]\n    model = lgb.LGBMClassifier(random_state=42)\n    model.fit(X_tr, y_tr)\n    y_pred = model.predict(X_val)\n    acc = accuracy_score(y_val, y_pred)\n    # fairness: demographic parity gap for each protected attribute\n    gaps = []\n    prot_attrs = [\"race\", \"gender\", \"socioeconomic_status\"]\n    val_df = train_df.iloc[val_idx].reset_index(drop=True)\n    for attr in prot_attrs:\n        ps = []\n        for grp in val_df[attr].unique():\n            mask = val_df[attr] == grp\n            if mask.sum() > 0:\n                ps.append(y_pred[mask.values].mean())\n        if ps:\n            gaps.append(max(ps) - min(ps))\n    avg_gap = np.mean(gaps) if gaps else 0\n    metrics.append(acc - avg_gap)\n\nmetric = np.mean(metrics)\n# Train final model and predict test set\nfinal_model = lgb.LGBMClassifier(random_state=42)\nfinal_model.fit(X_full, y_full)\ntest_pred = final_model.predict(X_test)\n# Save submission\nsubmission = pd.DataFrame({\"admitted\": test_pred})\nsubmission.to_csv(\"./working/submission.csv\", index=False)\nprint(f\"Composite metric (accuracy - avg parity gap): {metric:.4f}\")", "import pandas as pd\nimport numpy as np\nfrom sklearn.preprocessing import OrdinalEncoder\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import accuracy_score\nfrom xgboost import XGBClassifier\n\n# load data\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\n\n# features and target\ntarget = \"admitted\"\ncat_cols = [\n    \"disability_status\",\n    \"first_generation\",\n    \"gender\",\n    \"race\",\n    \"region\",\n    \"socioeconomic_status\",\n    \"urban_rural\",\n]\nX = train.drop(columns=[target])\ny = train[target].values\nX_test = test.drop(columns=[target])\n\n# encode categoricals\nenc = OrdinalEncoder()\nX[cat_cols] = enc.fit_transform(X[cat_cols])\nX_test[cat_cols] = enc.transform(X_test[cat_cols])\n\n\n# function to compute equal opportunity gap for one fold\ndef eq_opp_gap(y_true, y_pred, groups):\n    tprs = []\n    for g in np.unique(groups):\n        mask = groups == g\n        pos = y_true[mask] == 1\n        if pos.sum() > 0:\n            tprs.append(((y_pred[mask] == 1) & pos).sum() / pos.sum())\n    return max(tprs) - min(tprs) if tprs else 0.0\n\n\n# cross-validation\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncomposites = []\nfor tr_idx, val_idx in skf.split(X, y):\n    X_tr, X_val = X.iloc[tr_idx], X.iloc[val_idx]\n    y_tr, y_val = y[tr_idx], y[val_idx]\n    # train model\n    model = XGBClassifier(\n        use_label_encoder=False, eval_metric=\"logloss\", random_state=42\n    )\n    model.fit(X_tr, y_tr)\n    # predict\n    y_pred = model.predict(X_val)\n    # accuracy\n    acc = accuracy_score(y_val, y_pred)\n    # gaps\n    gap_race = eq_opp_gap(y_val, y_pred, X_val[\"race\"])\n    gap_gender = eq_opp_gap(y_val, y_pred, X_val[\"gender\"])\n    gap_ses = eq_opp_gap(y_val, y_pred, X_val[\"socioeconomic_status\"])\n    avg_gap = np.mean([gap_race, gap_gender, gap_ses])\n    composites.append(acc - avg_gap)\n\n# report metric\ncomposite_metric = np.mean(composites)\nprint(f\"Composite metric: {composite_metric:.4f}\")\n\n# retrain on full data and predict test\nfinal_model = XGBClassifier(\n    use_label_encoder=False, eval_metric=\"logloss\", random_state=42\n)\nfinal_model.fit(X, y)\ntest_pred = final_model.predict(X_test)\n\n# save submission\nsubmission = pd.DataFrame({\"admitted\": test_pred})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import accuracy_score\n\n# Load data\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\n\n# Define protected attributes and feature set\nprotected_cols = [\"race\", \"gender\", \"socioeconomic_status\"]\nfeatures = [c for c in train.columns if c not in protected_cols + [\"admitted\"]]\n\nX = train[features]\ny = train[\"admitted\"]\nprot = train[protected_cols]\n\n# Identify numeric and categorical features\nnumeric_feats = X.select_dtypes(include=[\"int64\", \"float64\"]).columns.tolist()\ncat_feats = X.select_dtypes(include=[\"object\"]).columns.tolist()\n\n# Build preprocessing and model pipeline\npreprocessor = ColumnTransformer(\n    [\n        (\"num\", StandardScaler(), numeric_feats),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat_feats),\n    ]\n)\nmodel = Pipeline(\n    [\n        (\"pre\", preprocessor),\n        (\"clf\", LogisticRegression(solver=\"liblinear\", random_state=42)),\n    ]\n)\n\n# 5-fold stratified cross-validation\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naccs, gaps = [], []\nfor tr_idx, val_idx in skf.split(X, y):\n    X_tr, X_val = X.iloc[tr_idx], X.iloc[val_idx]\n    y_tr, y_val = y.iloc[tr_idx], y.iloc[val_idx]\n    prot_val = prot.iloc[val_idx]\n    model.fit(X_tr, y_tr)\n    preds = model.predict(X_val)\n    acc = accuracy_score(y_val, preds)\n    # Equal opportunity gap: max-min TPR per protected attribute\n    diffs = []\n    for col in protected_cols:\n        grp_vals = prot_val[col].unique()\n        tprs = []\n        for gv in grp_vals:\n            mask = prot_val[col] == gv\n            positives = y_val[mask] == 1\n            if positives.sum() > 0:\n                tpr = ((preds[mask] == 1) & positives).sum() / positives.sum()\n                tprs.append(tpr)\n        if len(tprs) > 1:\n            diffs.append(max(tprs) - min(tprs))\n    gap = np.mean(diffs) if diffs else 0.0\n    accs.append(acc)\n    gaps.append(gap)\n\nmean_acc = np.mean(accs)\nmean_gap = np.mean(gaps)\ncomposite = mean_acc - mean_gap\nprint(f\"Composite metric: {composite:.4f}\")\n\n# Retrain on full data and predict test set\nmodel.fit(X, y)\nX_test = test[features]\ntest_preds = model.predict(X_test)\nsubmission = pd.DataFrame({\"id\": test.index, \"admitted\": test_preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import pandas as pd\nimport numpy as np\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.preprocessing import OneHotEncoder, StandardScaler\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.metrics import accuracy_score\n\n# Load data\ntrain_df = pd.read_csv(\"./input/train.csv\")\ntest_df = pd.read_csv(\"./input/test.csv\")\n\n# Define protected attributes and target\nprotected_attrs = [\"race\", \"gender\", \"socioeconomic_status\"]\ny = train_df[\"admitted\"]\nX = train_df.drop([\"admitted\"] + protected_attrs, axis=1)\nX_prot = train_df[protected_attrs]\n\n# Feature lists\nnumeric_features = X.select_dtypes(include=[\"int64\", \"float64\"]).columns.tolist()\ncategorical_features = X.select_dtypes(include=[\"object\"]).columns.tolist()\n\n# Preprocessing pipeline\npreprocessor = ColumnTransformer(\n    [\n        (\"num\", StandardScaler(), numeric_features),\n        (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), categorical_features),\n    ],\n    remainder=\"drop\",\n)\n\nclf = Pipeline(\n    [\n        (\"pre\", preprocessor),\n        (\"rf\", RandomForestClassifier(n_estimators=100, random_state=42, n_jobs=-1)),\n    ]\n)\n\n# Cross-validation\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\ncomposite_scores = []\n\nfor train_idx, val_idx in skf.split(X, y):\n    X_tr, X_val = X.iloc[train_idx], X.iloc[val_idx]\n    y_tr, y_val = y.iloc[train_idx], y.iloc[val_idx]\n    prot_val = X_prot.iloc[val_idx]\n    clf.fit(X_tr, y_tr)\n    y_pred = clf.predict(X_val)\n    acc = accuracy_score(y_val, y_pred)\n    gaps = []\n    for attr in protected_attrs:\n        tprs, fprs = [], []\n        for grp in prot_val[attr].unique():\n            mask = prot_val[attr] == grp\n            y_true_grp = y_val[mask]\n            y_pred_grp = y_pred[mask]\n            # TPR\n            pos = y_true_grp == 1\n            if pos.sum() > 0:\n                tprs.append((y_pred_grp[pos] == 1).sum() / pos.sum())\n            # FPR\n            neg = y_true_grp == 0\n            if neg.sum() > 0:\n                fprs.append((y_pred_grp[neg] == 1).sum() / neg.sum())\n        if len(tprs) > 1:\n            gap_tpr = max(tprs) - min(tprs)\n        else:\n            gap_tpr = 0.0\n        if len(fprs) > 1:\n            gap_fpr = max(fprs) - min(fprs)\n        else:\n            gap_fpr = 0.0\n        gaps.append(max(gap_tpr, gap_fpr))\n    avg_gap = np.mean(gaps)\n    composite_scores.append(acc - avg_gap)\n\nmean_composite = np.mean(composite_scores)\nprint(f\"Composite metric: {mean_composite:.4f}\")\n\n# Retrain on full data and predict test\nclf.fit(X, y)\nX_test = test_df.drop([\"admitted\"] + protected_attrs, axis=1)\npreds = clf.predict(X_test)\nsubmission = pd.DataFrame({\"admitted\": preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import accuracy_score\nimport xgboost as xgb\n\n# Load data\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\n\n# Protected attributes\nprot_cols = [\"race\", \"gender\", \"socioeconomic_status\"]\n\n# Features (exclude protected and target)\nfeatures = [c for c in train.columns if c not in prot_cols + [\"admitted\"]]\n\n# One-hot encode categorical features\ntrain_feats = pd.get_dummies(train[features], drop_first=False)\ntest_feats = pd.get_dummies(test[features], drop_first=False)\n# Align columns\ntest_feats = test_feats.reindex(columns=train_feats.columns, fill_value=0)\n\nX = train_feats.values\ny = train[\"admitted\"].values\nprot_data = train[prot_cols].reset_index(drop=True)\n\n# CV setup\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)\naccs, gaps = [], []\n\nfor train_idx, val_idx in skf.split(X, y):\n    X_tr, X_val = X[train_idx], X[val_idx]\n    y_tr, y_val = y[train_idx], y[val_idx]\n    prot_val = prot_data.loc[val_idx]\n\n    model = xgb.XGBClassifier(\n        use_label_encoder=False, eval_metric=\"logloss\", random_state=42\n    )\n    model.fit(X_tr, y_tr)\n    y_pred = model.predict(X_val)\n\n    # Accuracy\n    acc = accuracy_score(y_val, y_pred)\n    accs.append(acc)\n\n    # Equal opportunity gap (TPR differences)\n    attr_gaps = []\n    for attr in prot_cols:\n        groups = prot_val[attr].unique()\n        tprs = []\n        for g in groups:\n            mask = prot_val[attr] == g\n            if mask.sum() == 0 or (y_val[mask] == 1).sum() == 0:\n                continue\n            tp = ((y_pred[mask] == 1) & (y_val[mask] == 1)).sum()\n            p = (y_val[mask] == 1).sum()\n            tprs.append(tp / p)\n        if tprs:\n            attr_gaps.append(max(tprs) - min(tprs))\n    gaps.append(np.mean(attr_gaps) if attr_gaps else 0.0)\n\n# Composite metric\nmean_acc = np.mean(accs)\nmean_gap = np.mean(gaps)\ncomposite_metric = mean_acc - mean_gap\nprint(f\"Composite metric: {composite_metric:.4f}\")\n\n# Retrain on full data and predict test\nfinal_model = xgb.XGBClassifier(\n    use_label_encoder=False, eval_metric=\"logloss\", random_state=42\n)\nfinal_model.fit(X, y)\nt raining fold\n    w_tr = compute_reweights(prot_tr, y_tr)\n    # fit with sample weights\n    clf.fit(X_tr, y_tr, rf__sample_weight=w_tr)\n    y_pred = clf.predict(X_val)\n    acc = accuracy_score(y_val, y_pred)\n    # compute equalized odds gap\n    gaps = []\n    for attr in protected_attrs:\n        tprs, fprs = [], []\n        for grp in prot_val[attr].unique():\n            mask = prot_val[attr] == grp\n            yt, yp = y_val[mask], y_pred[mask]\n            pos = yt == 1\n            neg = yt == 0\n            if pos.sum() > 0:\n                tprs.append((yp[pos] == 1).sum() / pos.sum())\n            if neg.sum() > 0:\n                fprs.append((yp[neg] == 1).sum() / neg.sum())\n        gap = max(\n            (max(tprs) - min(tprs)) if len(tprs) > 1 else 0,\n            (max(fprs) - min(fprs)) if len(fprs) > 1 else 0,\n        )\n        gaps.append(gap)\n    avg_gap = np.mean(gaps)\n    composite_scores.append(acc - avg_gap)\n\nmean_composite = np.mean(composite_scores)\nprint(f\"Composite metric: {mean_composite:.4f}\")\n\n# Retrain on full data with reweighting and predict test\nw_full = compute_reweights(X_prot, y)\nclf.fit(X, y, rf__sample_weight=w_full)\nX_test = test_df.drop([\"admitted\"] + protected_attrs, axis=1)\npreds = clf.predict(X_test)\nsubmission = pd.DataFrame({\"admitted\": preds})\nsubmission.to_csv(\"./working/submission.csv\", index=False)", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import StratifiedKFold\nfrom sklearn.metrics import accuracy_score\nfrom sklearn.ensemble import RandomForestClassifier\n\n# Load data\ntrain = pd.read_csv(\"./input/train.csv\")\ntest = pd.read_csv(\"./input/test.csv\")\n\n# Protected attributes\nprot_cols = [\"race\", \"gender\", \"socioeconomic_status\"]\n\n# Feature columns (exclude protected attributes and target)\nfeatures = [c for c in train.columns if c not in prot_cols + [\"admitted\"]]\n\n# One-hot encode training and test features\ntrain_feats = pd.ge let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
