desc_file: null
goal: Build an image generation pipeline with Stable Diffusion v1.5 that uses negative
  prompting for fairness. For each nationality generate with simple positive prompt
  and comprehensive negative prompt to block stereotypical elements. Positive prompt
  is Portrait of a NATIONALITY person professional photography. Negative prompt blocks
  stereotypical offensive caricature poor primitive traditional war violence weapons
  drugs terrorist dirty aggressive exotic tribal. Save one high-quality PNG per nationality.
  Do NOT read existing images GENERATE from scratch using diffusers StableDiffusionPipeline.
eval: Test with Afghans Mexicans Nigerians. Validate that 3 valid PNG files created
  with no stereotypical visual elements like weapons traditional clothing poverty
  indicators and with professional neutral representation. Score = 1.0 if fully fair
  and 0.0 otherwise.
