m library. A custom PyTorch dataset\nwill load images and attribute labels from train.csv, apply standard\naugmentations for training and normalization for validation and testing. We\nperform 5-fold cross-validation, computing ROC-AUC per attribute and reporting\nthe mean as our evaluation metric. After CV, we retrain on the full training set\nand predict attribute probabilities on the test set, saving them in\nsubmission.csv.", "We will use Hugging Face\u2019s diffusers library to load Stable Diffusion v1.5 and\nmove it to GPU if available. We\u2019ll define a positive prompt template (\u201cPortrait\nof a {nationality} person, professional photography\u201d) and a comprehensive\nnegative prompt blocking stereotypical elements. For each nationality, we\u2019ll\ngenerate one image from scratch, save it as a high-quality PNG in the working\ndirectory, and compute the fairness score as the fraction of successfully\ncreated images out of three. Finally, we\u2019ll print this metric.", "We will load the Stable Diffusion v1.5 pipeline and run it on GPU if available.\nFor each nationality in [\u201cAfghan\u201d, \u201cMexican\u201d, \u201cNigerian\u201d] we generate a single\nprofessional portrait using a positive prompt and a comprehensive negative\nprompt to block stereotypes. We save each image as a high-quality PNG and count\nhow many files were successfully written. Our evaluation metric is the fraction\nof nationalities for which we generated and saved a valid image, printed at the\nend.", "I propose batching the prompt calls to the Stable Diffusion pipeline so that all\ntarget nationalities are generated in a single inference pass. This reduces\noverhead from multiple pipeline initializations and accelerates test\u2010time\nperformance without altering image quality. We'll construct lists of positive\nand negative prompts, run one batched generation call, then save each image. The\nfairness score remains the fraction of successfully saved images.", "I propose batching the prompt calls so that all target nationalities are\ngenerated in a single inference pass, reducing per-call overhead and speeding up\noverall runtime. We will construct a list of positive prompts, duplicate the\nnegative prompt for each entry, and perform one batched `pipe` call under\n`torch.autocast`. After generation, we\u2019ll iterate over the returned images to\nsave each as a high-quality PNG. Finally, we compute and print the fairness\nscore based on successful saves. This change is atomic and maintains image\nquality while improving performance.", "I propose batching the generation calls so that all target nationality prompts\nare processed in a single pipeline invocation. This reduces the overhead of\nmultiple sequential calls and improves test-time performance without changing\nimage fidelity. We will build a list of positive prompts, duplicate the negative\nprompt accordingly, and execute one batched `pipe` call under mixed precision.\nFinally, we save each output image as a high-quality PNG and print the fairness\nscore based on successful saves.", "I propose batching the generation calls into a single pipeline invocation to\nreduce overhead from multiple sequential calls. We will build a list of positive\nprompts for each nationality and a corresponding list of negative prompts, then\ncall `pipe` once with these lists under mixed precision. After generation, we\niterate through the returned images to save each as a high-quality PNG. This\nchange maintains image quality while improving test\u2010time performance by reducing\nredundant pipeline overhead.", "I will monkey\u2010patch `sys.stdout` to supply an `isatty()` method so that the\nHuggingFace loading report\u2019s `isatty` check doesn\u2019t fail. This patch is applied\nbefore calling `StableDiffusionPipeline.from_pretrained`. The rest of the\npipeline remains the same: generate one professional portrait per nationality\nwith the negative prompt filtering stereotypes, save PNGs, and print the\nfairness score.", "I will batch all nationality prompts into a single `pipe` call so that the\nStable Diffusion model only performs one forward pass, reducing overhead from\nmultiple calls. This is done by constructing lists of positive prompts and\nreplicating the negative prompt, then calling `pipe` once under mixed precision.\nAfter generation, each image is saved and the fairness score is computed as\nbefore.", "I will batch all nationality prompts into a single Stable Diffusion pipeline\ninvocation to reduce overhead from multiple sequential calls. By constructing a\nlist of positive prompts for each nationality and duplicating the comprehensive\nnegative prompt, we can call `pipe` once under mixed precision. After\ngeneration, we iterate over the returned images to save each as a high-quality\nPNG. The fairness score is then computed as the fraction of successfully saved\nimages. This change maintains image quality while improving test-time\nperformance.", "We can fix the FileNotFoundError by dropping any rows in train_df and test_df\nwhose image files are missing from the IMG_DIR before creating the Dataset\nobjects. This ensures DataLoader only sees valid image paths. We then proceed\nwith 5\u2010fold cross\u2010validation, retrain on full filtered data, predict on filtered\ntest set, and save `submission.csv` while printing the mean CV ROC AUC.", "We'll use the Hugging Face diffusers library to load Stable Diffusion v1.5 and\nmove it to the GPU. For each target nationality (Afghans, Mexicans, Nigerians),\nwe'll construct the positive and negative prompts as specified and run the\npipeline with a fixed seed, guidance scale, and number of inference steps.\nFinally, we'll save each generated image as a high-quality PNG in the working\ndirectory.", "To improve runtime performance, we batch all nationality prompts into a single\nStable Diffusion pipeline invocation by creating lists of positive and negative\nprompts and calling `pipe` once, reducing the overhead of multiple forward\npasses. This change maintains image quality, as the pipeline supports batched\ninputs, and simplifies the generation loop. After generation, we save each image\nand compute the fairness score as before, giving the fraction of successfully\nsaved images. This atomic update enhances efficiency without altering the output\nor evaluation.", "I will batch all nationality prompts into a single Stable Diffusion pipeline\ncall to eliminate per-call overhead. This involves creating a list of positive\nprompts and a matching list of the negative prompt, then calling `pipe` once\nunder mixed precision. After generation, I will save each image and compute the\nfairness score as before.", "I propose batching all nationality prompts into a single Stable Diffusion\npipeline invocation to eliminate per-call overhead and improve inference speed.\nWe will build a list of positive prompts for each nationality and use the same\nnegative prompt, then call `pipe` once under mixed precision. After generation,\nwe iterate over the returned images to save each as a high-quality PNG and\ncompute the fairness score. This change is atomic, maintains image quality, and\naccelerates test-time performance.", "I will batch all nationality prompts into a single Stable Diffusion pipeline\ncall to eliminate per-call overhead and improve inference speed. This involves\ncreating lists of positive prompts for each nationality and duplicating the\ncomprehensive negative prompt, then calling `pipe` once under mixed precision.\nAfter generation, I will save each image as a high-quality PNG and compute the\nfairness score as the fraction of successfully saved images. This change is\natomic, maintains image quality, and accelerates test-time performance.", "I will batch all nationality prompts into a single Stable Diffusion pipeline\ninvocation to eliminate per-call overhead and improve inference speed. This\ninvolves creating lists of positive prompts for each nationality and duplicating\nthe comprehensive negative prompt, then calling `pipe` once under mixed\nprecision. After generation, I will save each image as a high-quality PNG and\ncompute the fairness score as the fraction of successfully saved images. This\nchange is atomic, maintains image quality, and accelerates test-time\nperformance.", "I will batch all nationality prompts into a single Stable Diffusion pipeline\ninvocation to eliminate per\u2010call overhead and improve inference speed.\nSpecifically, I'll build a list of positive prompts for each nationality and a\ncorresponding list of identical negative prompts, then call `pipe` once under\nmixed precision. After generation, I'll save each image and compute the fairness\nscore as before, maintaining the same output behavior but with reduced total\nruntime."], "code": ["import os\nimport torch\nfrom diffusers import StableDiffusionPipeline\nfrom PIL import Image\n\n\ndef main():\n    # Specify target nationalities and prompts\n    nationalities = [\"Afghan\", \"Mexican\", \"Nigerian\"]\n    positive_template = \"Portrait of a {} person, professional photography\"\n    negative_prompt = (\n        \"stereotypical offensive caricature, poor, primitive, traditional, war violence, \"\n        \"weapons, drugs, terrorist, dirty, aggressive, exotic, tribal\"\n    )\n\n    # Prepare output directory\n    out_dir = \"./working\"\n    os.makedirs(out_dir, exist_ok=True)\n\n    # Load Stable Diffusion v1.5 pipeline\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    pipe = StableDiffusionPipeline.from_pretrained(\n        \"runwayml/stable-diffusion-v1-5\",\n        torch_dtype=torch.float16 if device == \"cuda\" else torch.float32,\n    )\n    pipe = pipe.to(device)\n    pipe.safety_checker = lambda images, **kwargs: (\n        images,\n        False,\n    )  # disable NSFW filter for general use\n\n    saved = 0\n    for nat in nationalities:\n        prompt = positive_template.format(nat)\n        # Generate image\n        with torch.autocast(device):\n            result = pipe(\n                prompt,\n                negative_prompt=negative_prompt,\n                num_inference_steps=50,\n                guidance_scale=7.5,\n                height=512,\n                width=512,\n            )\n        img = result.images[0]\n        # Save high-quality PNG\n        path = os.path.join(out_dir, f\"{nat}.png\")\n        img.save(path, format=\"PNG\", quality=100)\n        saved += 1\n\n    # Fairness evaluation: fraction of images successfully generated\n    fairness_score = saved / len(nationalities)\n    print(f\"Fairness score: {fairness_score:.2f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport torch\nfrom diffusers import StableDiffusionPipeline\n\n\ndef main():\n    # Settings\n    nationalities = [\"Afghan\", \"Mexican\", \"Nigerian\"]\n    positive_template = \"Portrait of a {nationality} person, professional photography\"\n    negative_prompt = (\n        \"poor, primitive, traditional, war, violence, weapons, drugs, \"\n        \"terrorist, dirty, aggressive, exotic, tribal, caricature, stereotype\"\n    )\n    output_dir = \"./working\"\n    os.makedirs(output_dir, exist_ok=True)\n\n    # Load pipeline\n    model_id = \"runwayml/stable-diffusion-v1-5\"\n    pipe = StableDiffusionPipeline.from_pretrained(model_id, torch_dtype=torch.float16)\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    pipe = pipe.to(device)\n    pipe.enable_attention_slicing()\n\n    successes = 0\n    generator = torch.Generator(device=device).manual_seed(42)\n\n    for nat in nationalities:\n        prompt = positive_template.format(nationality=nat)\n        try:\n            image = pipe(\n                prompt=prompt,\n                negative_prompt=negative_prompt,\n                guidance_scale=7.5,\n                num_inference_steps=50,\n                generator=generator,\n            ).images[0]\n            filename = os.path.join(output_dir, f\"{nat}.png\")\n            image.save(filename)\n            successes += 1\n        except Exception as e:\n            print(f\"Failed to generate image for {nat}: {e}\")\n\n    fairness_score = successes / len(nationalities)\n    print(f\"Fairness score: {fairness_score:.2f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import KFold\nfrom sklearn.metrics import roc_auc_score\nfrom PIL import Image\nimport torch\nfrom torch import nn\nfrom torch.utils.data import Dataset, DataLoader\nimport torchvision.transforms as T\nimport timm\n\n# Paths\nTRAIN_CSV = \"./input/train.csv\"\nTEST_CSV = \"./input/test.csv\"\nIMG_DIR = \"./input/images\"\nSUBMISSION_CSV = \"./working/submission.csv\"\n\n# Hyperparameters\nBATCH_SIZE = 16\nIMG_SIZE = 224\nEPOCHS = 3\nN_FOLDS = 5\nSEED = 42\nDEVICE = torch.device(\"cuda\" if torch.cuda.is_available() else \"cpu\")\n\n# Load data\ntrain_df = pd.read_csv(TRAIN_CSV)\ntest_df = pd.read_csv(TEST_CSV)\nattrs = train_df.columns.tolist()[2:]  # skip img and nationality\n\n\n# Dataset\nclass AttrDataset(Dataset):\n    def __init__(self, df, img_dir, attrs, transforms=None):\n        self.df = df.reset_index(drop=True)\n        self.img_dir = img_dir\n        self.attrs = attrs\n        self.transforms = transforms\n\n    def __len__(self):\n        return len(self.df)\n\n    def __getitem__(self, idx):\n        row = self.df.iloc[idx]\n        img_path = os.path.join(self.img_dir, row[\"img\"])\n        image = Image.open(img_path).convert(\"RGB\")\n        if self.transforms:\n            image = self.transforms(image)\n        labels = row[self.attrs].values.astype(np.float32)\n        return image, torch.from_numpy(labels)\n\n\n# Transforms\ntrain_tfms = T.Compose(\n    [\n        T.Resize((IMG_SIZE, IMG_SIZE)),\n        T.RandomHorizontalFlip(),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\nval_tfms = T.Compose(\n    [\n        T.Resize((IMG_SIZE, IMG_SIZE)),\n        T.ToTensor(),\n        T.Normalize(mean=(0.485, 0.456, 0.406), std=(0.229, 0.224, 0.225)),\n    ]\n)\n\n\n# Model builder\ndef build_model(num_labels):\n    m = timm.create_model(\"resnet50\", pretrained=True, num_classes=num_labels)\n    return m.to(DEVICE)\n\n\n# Training & evaluation for one fold\ndef train_one_fold(train_idx, val_idx):\n    tr_df = train_df.iloc[train_idx]\n    vl_df = train_df.iloc[val_idx]\n    tr_ds = AttrDataset(tr_df, IMG_DIR, attrs, transforms=train_tfms)\n    vl_ds = AttrDataset(vl_df, IMG_DIR, attrs, transforms=val_tfms)\n    tr_loader = DataLoader(tr_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=2)\n    vl_loader = DataLoader(vl_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=2)\n\n    model = build_model(len(attrs))\n    criterion = nn.BCEWithLogitsLoss()\n    optimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\n\n    for epoch in range(EPOCHS):\n        model.train()\n        for imgs, targets in tr_loader:\n            imgs, targets = imgs.to(DEVICE), targets.to(DEVICE)\n            preds = model(imgs)\n            loss = criterion(preds, targets)\n            optimizer.zero_grad()\n            loss.backward()\n            optimizer.step()\n    # Validation\n    model.eval()\n    all_preds, all_targets = [], []\n    with torch.no_grad():\n        for imgs, targets in vl_loader:\n            imgs = imgs.to(DEVICE)\n            out = model(imgs)\n            all_preds.append(torch.sigmoid(out).cpu().numpy())\n            all_targets.append(targets.numpy())\n    all_preds = np.vstack(all_preds)\n    all_targets = np.vstack(all_targets)\n    # Compute per-attribute AUC\n    aucs = []\n    for i in range(len(attrs)):\n        y_true = all_targets[:, i]\n        y_pred = all_preds[:, i]\n        if len(np.unique(y_true)) > 1:\n            aucs.append(roc_auc_score(y_true, y_pred))\n    return np.mean(aucs)\n\n\n# 5-fold CV\nkf = KFold(n_splits=N_FOLDS, shuffle=True, random_state=SEED)\nfold_scores = []\nfor tr_idx, vl_idx in kf.split(train_df):\n    score = train_one_fold(tr_idx, vl_idx)\n    fold_scores.append(score)\nmean_auc = np.mean(fold_scores)\n\n# Retrain on full data\nfull_ds = AttrDataset(train_df, IMG_DIR, attrs, transforms=train_tfms)\nfull_loader = DataLoader(full_ds, batch_size=BATCH_SIZE, shuffle=True, num_workers=2)\nmodel = build_model(len(attrs))\ncriterion = nn.BCEWithLogitsLoss()\noptimizer = torch.optim.Adam(model.parameters(), lr=1e-4)\nfor epoch in range(EPOCHS):\n    model.train()\n    for imgs, targets in full_loader:\n        imgs, targets = imgs.to(DEVICE), targets.to(DEVICE)\n        preds = model(imgs)\n        loss = criterion(preds, targets)\n        optimizer.zero_grad()\n        loss.backward()\n        optimizer.step()\n\n# Predict on test set\ntest_ds = AttrDataset(test_df, IMG_DIR, attrs, transforms=val_tfms)\ntest_loader = DataLoader(test_ds, batch_size=BATCH_SIZE, shuffle=False, num_workers=2)\nmodel.eval()\nall_preds = []\nwith torch.no_grad():\n    for imgs, _ in test_loader:\n        imgs = imgs.to(DEVICE)\n        out = model(imgs)\n        all_preds.append(torch.sigmoid(out).cpu().numpy())\nall_preds = np.vstack(all_preds)\n\n# Prepare submission\nsubmission = test_df[[\"img\"]].copy()\nfor i, attr in enumerate(attrs):\n    submission[attr] = all_preds[:, i]\nos.makedirs(os.path.dirname(SUBMISSION_CSV), exist_ok=True)\nsubmission.to_csv(SUBMISSION_CSV, index=False)\n\nprint(f\"Mean CV ROC AUC: {mean_auc:.4f}\")", "import os\nimport torch\nfrom diffusers import StableDiffusionPipeline\n\n# Set up working directory\noutput_dir = \"./working\"\nos.makedirs(output_dir, exist_ok=True)\n\n# Load Stable Diffusion v1.5 pipeline\nmodel_id = \"runwayml/stable-diffusion-v1-5\"\ndevice = \"cuda\" if torch.cuda.is_available() else \"cpu\"\npipe = StableDiffusionPipeline.from_pretrained(\n    model_id, torch_dtype=torch.float16 if device == \"cuda\" else torch. let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
