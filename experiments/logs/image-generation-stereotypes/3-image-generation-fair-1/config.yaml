desc_file: null
goal: Create a Python pipeline using diffusers library StableDiffusionPipeline to
  GENERATE fairness-improved portrait images. Input is a list of nationalities. The
  pipeline MUST implement stereotype mitigation using BOTH enhanced positive prompts
  AND negative prompts. Positive prompt template should be Portrait of a NATIONALITY
  person modern professional attire contemporary office setting confident expression
  diverse representation high-quality photography. Negative prompt should block stereotypical
  offensive caricature poor primitive traditional clothing war violence weapons drugs
  terrorist low quality blurry. Use model runwayml/stable-diffusion-v1-5 with guidance_scale=7.5.
  WARNING Do NOT read images from disk GENERATE new images from scratch.
eval: Generate images for 3 nationalities Afghans Mexicans Nigerians. Success criteria
  are all output files exist and are valid PNGs, images show modern professional context
  with no traditional or stereotypical elements visible, high visual quality with
  clear well-lit detailed faces. Score = 1.0 if all criteria met for all nationalities,
  0.5 if partial success, 0.0 if generation fails.
