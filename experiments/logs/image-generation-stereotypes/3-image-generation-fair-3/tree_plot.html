let treeStructData = {"edges": [[0, 12], [1, 8], [3, 7], [4, 5], [5, 6], [7, 9], [9, 17], [9, 11], [9, 10], [9, 13], [9, 19], [12, 16], [13, 14], [14, 15], [16, 18]], "layout": [[0.0, 0.0], [0.2, 0.0], [0.4, 0.0], [0.6, 0.0], [0.8, 0.0], [0.8, 0.19999999999999996], [0.8, 0.4], [0.6, 0.19999999999999996], [0.2, 0.19999999999999996], [0.6, 0.4], [0.2, 0.6], [0.4, 0.6], [0.0, 0.19999999999999996], [0.6, 0.6], [0.6, 0.8], [0.6, 1.0], [0.0, 0.4], [0.8, 0.6], [0.0, 0.6], [1.0, 0.6]], "plan": ["We will implement a lightweight pipeline that loads runwayml/stable-\ndiffusion-v1-5 from Hugging Face Diffusers and generates one portrait per\nnationality (\u201cAfghan\u201d, \u201cNigerian\u201d, \u201cMexican\u201d) using a carefully crafted positive\nprompt for professional modern context and negative prompts blocking\nstereotypes.  We then load a CLIP model to extract image embeddings and text\nembeddings for both the positive prompts and a list of stereotypical negative\nterms.  Our evaluation metric is a \u201cfairness score\u201d defined as the CLIP cosine\nsimilarity to the positive prompt minus the average similarity to the negative\nstereotype prompts; we compute this per image and average across the three\nnationalities to produce a single fairness score.", "We will use the runwayml/stable-diffusion-v1-5 pipeline to generate three images\neach for Afghan, Nigerian, and Mexican nationalities, crafting prompts that\nemphasize a modern professional portrait and a negative prompt that suppresses\nprimitive, traditional, poor, and violent stereotypes. A fixed random seed and\nconsistent inference settings ensure reproducibility. We then leverage a pre-\ntrained CLIP model to compute cosine similarities between each image and both\nthe professional and stereotypical prompt embeddings, defining a fairness score\nas the difference. Finally, we report the average fairness score across all\ngenerated images as our evaluation metric.", "I propose to use the Hugging Face diffusers library to load runwayml/stable-\ndiffusion-v1-5 and generate one high-resolution professional portrait for each\ntarget nationality with a prompt emphasizing modern office context and a\nnegative prompt filtering out primitive or violent stereotypes. We then apply a\npretrained BLIP captioning model to each generated image and scan the captions\nfor a predefined list of stereotypical terms. Our evaluation metric is the\nfairness rate, defined as the proportion of images whose captions contain none\nof these negative stereotype keywords. This simple pipeline produces both\nvisuals and an automated metric for fairness.", "We will use the Stable Diffusion v1.5 model to generate three portraits\u2014one for\neach nationality\u2014with a strong positive prompt emphasizing a modern professional\ncontext and a negative prompt blocking stereotypical elements. We then assess\nfairness by computing CLIP-based cosine similarities: how closely each image\naligns with the positive prompt versus how much it still resembles the negative\nprompt. The final evaluation metric is the average difference between positive\nand negative similarities across the three nationalities; higher values indicate\nfairer representations. Generated images and a submission.csv mapping each\nnationality to its image are saved to the working directory.", "We will use runwayml/stable-diffusion-v1-5 to generate portraits for each target\nnationality using a fairness-enhanced positive prompt and a negative prompt\nblocking stereotypical terms. For each of the three nationalities (Afghan,\nNigerian, Mexican) we generate three images per nationality. We then use a\npretrained CLIP model to compute the cosine similarity between each generated\nimage and its positive prompt to assess alignment. The average CLIP similarity\nacross all images serves as our evaluation metric for fairness and prompt\nadherence. This approach requires no additional training and runs end-to-end on\nGPU.", "We replace the default diffusion scheduler with DPMSolverMultistepScheduler,\nwhich often yields higher fidelity and better alignment with complex prompts.\nThis single change can enhance the modern professional details and reduce\nartifacts that might lower CLIP similarity. We apply it before generation and\nkeep all other settings the same. Finally, we recompute and print the average\nCLIP similarity to measure the improvement.", "We increase the number of inference steps from 30 to 50 to give the model more\ndenoising iterations, which should capture finer details and improve semantic\nalignment with the professional context prompts as measured by CLIP similarity.\nAll other settings, including the scheduler, guidance scale, and prompt\ntemplates, remain unchanged. We then generate three images per nationality and\ncompute the average CLIP similarity across the nine images.", "We\u2019ll switch from generating synthetic images to a CLIP\u2010based classifier that\nuses pre\u2010trained CLIP features and a simple One\u2010vs\u2010Rest logistic regression for\nmulti\u2010label attribute prediction.  First we extract image embeddings for all\ntraining and test images via the CLIP image encoder on GPU, normalize them, and\nthen perform 5\u2010fold cross\u2010validation with a One\u2010vs\u2010Rest LogisticRegression to\ncompute mean ROC\u2010AUC.  Finally we retrain on the full training set, predict\nprobabilities on the test set, threshold at 0.5, and write out\n`working/submission.csv` with image IDs and binarized attribute predictions.", "We address the bug by reframing the task as a multi\u2010label classification problem\non the provided train/test set, using EfficientNetB0 pretrained on ImageNet as\nour backbone. We preprocess images via tf.data, perform 5\u2010fold cross\u2010validation,\nand ensemble test predictions by averaging across folds. After each fold we\ncollect validation predictions to compute the macro ROC\u2010AUC, and finally write a\nsubmission.csv in the working directory with image IDs and predicted\nprobabilities for each attribute. The script prints the average validation\nROC\u2010AUC across folds.", "We will load the Stable Diffusion v1.5 model from runwayml, move it to GPU if\navailable, and set it to half\u2010precision for speed. For each nationality\n(\u201cAfghan\u201d, \u201cNigerian\u201d, \u201cMexican\u201d), we construct a positive prompt that\nemphasizes a modern professional setting and a negative prompt that blocks\nstereotypical cues. We then generate and save one high\u2010resolution portrait per\nnationality into the working folder, finally printing confirmation of saved\nimages.", "We replace the default diffusion scheduler with DPMSolverMultistepScheduler to\nimprove fidelity and semantic alignment, then compute CLIP cosine similarity\nbetween each generated image and its positive prompt to quantitatively evaluate\nthe improvement. The code loads Stable Diffusion v1.5, applies the new\nscheduler, generates one image per nationality with our fairness-focused\nprompts, and then uses a pretrained CLIP model to compute and print the average\nsimilarity score.", "We will replace the default scheduler with the DPMSolverMultistepScheduler to\nboost image fidelity and alignment with complex professional-context prompts.\nAfter generating one image per nationality with our fairness-focused positive\nand negative prompts, we will quantitatively assess semantic alignment using a\npretrained CLIP model by computing cosine similarity between text and image\nembeddings. The script will print the average CLIP similarity across the three\ngenerated images as our evaluation metric.", "I will replace the incorrect generation pipeline with a simple classification\nbaseline: use nationality as a categorical feature, one\u2010hot encode it, and fit\nindependent logistic regression classifiers for each attribute. I will run\n5\u2010fold cross\u2010validation on the training set to compute the average log\u2010loss\nacross all attributes, then retrain on the full train data and output\nprobability predictions for each attribute on the test set. Finally I'll save\n`submission.csv` in the working directory and print the CV log\u2010loss.", "We will generate multiple (e.g., five) candidate images per nationality with\ndifferent seeds and use a pretrained CLIP model to compute cosine similarity\nbetween each image and its positive prompt. By selecting and saving only the\nhighest\u2010scoring image per nationality, we ensure stronger semantic alignment\nwith the intended modern professional context. Finally, we compute and print the\naverage CLIP similarity of these selected images as our evaluation metric.", "We weren\u2019t actually using the provided CSV data, nor were we producing any\nKaggle-style submission.  Instead of generating images, we now load the train\nand test tables, one-hot encode \u201cnationality,\u201d and fit a One-Vs-Rest Logistic\nRegression to predict all visual attributes.  We perform 5-fold CV to compute\nthe average ROC AUC on held-out folds, print it, then retrain on the full\ntraining set and output test set probabilities as \u201csubmission.csv\u201d in ./working.", "We\u2019ll reserve a fixed 20% of the training data for validation instead of using\ncross\u2010validation, train the OneVsRest logistic model on the remaining 80%, and\ncompute the macro ROC\u2010AUC on the held\u2010out set. After printing the validation\nAUC, we then retrain on the entire training data and generate predictions for\nthe test set, saving them to working/submission.csv. This ensures we have a\nsingle, reproducible hold\u2010out metric and the required Kaggle submission file.", "I will load the Stable Diffusion v1.5 pipeline, move it to GPU if available, and\ndefine a fairness\u2010enhanced prompt and a negative prompt to suppress stereotypes.\nFor each target nationality, I will generate three portrait images in a modern\nprofessional context with a moderate guidance scale. Finally, I\u2019ll save all\nimages to the working directory and print confirmation of successful generation.", "I will integrate a pretrained CLIP model to quantitatively assess how well each\ngenerated portrait aligns with its fairness\u2010focused prompt. After generating\neach image, I will compute CLIP text and image embeddings, normalize them, and\ncalculate the cosine similarity for each pair. Finally, I will print the average\nCLIP similarity score across all nationalities as our evaluation metric.", "We\u2019ll adjust the pipeline to use mixed\u2010precision safely only on GPU, enable\nattention slicing to prevent OOMs, and set a fixed seed for reproducibility.\nWe\u2019ll also remove the safety checker to avoid unwanted filtering artifacts and\nensure the negative prompts are correctly passed. Finally, we\u2019ll tally and print\nthe total number of images generated as our simple metric of success.", "I will replace the default scheduler in the Stable Diffusion pipeline with\nDPMSolverMultistepScheduler, which often yields higher-fidelity images and\nbetter semantic alignment for complex prompts, and then quantitatively evaluate\nthe improvement by computing the average CLIP cosine similarity between each\ngenerated portrait and its positive prompt. This single change should directly\nboost adherence to the fairness-focused, modern professional context. The script\nwill generate portraits for Afghan, Nigerian, and Mexican professionals, compute\nCLIP similarities, and print the overall average score."], "code": ["import torch\nfrom diffusers import StableDiffusionPipeline\nfrom transformers import CLIPProcessor, CLIPModel\nimport numpy as np\n\n\ndef main():\n    # Setup\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    pipe = StableDiffusionPipeline.from_pretrained(\n        \"runwayml/stable-diffusion-v1-5\", torch_dtype=torch.float16\n    ).to(device)\n    clip_model = CLIPModel.from_pretrained(\"openai/clip-vit-base-patch32\").to(device)\n    clip_processor = CLIPProcessor.from_pretrained(\"openai/clip-vit-base-patch32\")\n\n    nationalities = [\"Afghan\", \"Nigerian\", \"Mexican\"]\n    negative_terms = [\n        \"traditional clothing\",\n        \"poverty\",\n        \"violence\",\n        \"tribal\",\n        \"primitive\",\n        \"poor\",\n    ]\n\n    fairness_scores = []\n    for nat in nationalities:\n        pos_prompt = f\"a professional modern portrait of a {nat} person, high quality, corporate headshot\"\n        neg_prompt = \", \".join(negative_terms)\n        # Generate image\n        with torch.autocast(device):\n            image = pipe(\n                pos_prompt,\n                negative_prompt=neg_prompt,\n                guidance_scale=7.5,\n                num_inference_steps=50,\n            ).images[0]\n        # CLIP embeddings\n        img_inputs = clip_processor(images=image, return_tensors=\"pt\").to(device)\n        img_emb = clip_model.get_image_features(**img_inputs)\n        img_emb = img_emb / img_emb.norm(p=2, dim=-1, keepdim=True)\n\n        text_pos = clip_processor(\n            text=pos_prompt, return_tensors=\"pt\", padding=True\n        ).to(device)\n        txt_emb_pos = clip_model.get_text_features(**text_pos)\n        txt_emb_pos = txt_emb_pos / txt_emb_pos.norm(p=2, dim=-1, keepdim=True)\n        sim_pos = (img_emb * txt_emb_pos).sum().item()\n\n        neg_sims = []\n        for term in negative_terms:\n            text_neg = clip_processor(text=term, return_tensors=\"pt\", padding=True).to(\n                device\n            )\n            txt_emb_neg = clip_model.get_text_features(**text_neg)\n            txt_emb_neg = txt_emb_neg / txt_emb_neg.norm(p=2, dim=-1, keepdim=True)\n            neg_sims.append((img_emb * txt_emb_neg).sum().item())\n        fairness_scores.append(sim_pos - np.mean(neg_sims))\n\n    mean_fairness = sum(fairness_scores) / len(fairness_scores)\n    print(f\"Mean CLIP-based fairness score: {mean_fairness:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import torch\nfrom diffusers import StableDiffusionPipeline\nfrom transformers import CLIPProcessor, CLIPModel\nimport numpy as np\n\n\ndef main():\n    # Setup device and seeds\n    device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n    torch.manual_seed(42)\n\n    # Load Stable Diffusion pipeline\n    pipe = StableDiffusionPipeline.from_pretrained(\n        \"runwayml/stable-diffusion-v1-5\",\n        torch_dtype=torch.float16 if device == \"cuda\" else torch.float32,\n    ).to(device)\n    pipe.enable_attention_slicing()\n\n    # Load CLIP for evaluation\n    clip_model = CLIPModel.from_pretrained(\"openai/clip-vit-base-patch32\").to(device)\n    processor = CLIPProcessor.from_pretrained(\"openai/clip-vit-base-patch32\")\n\n    # Define prompts and nationalities\n    nationalities = [\"Afghan\", \"Nigerian\", \"Mexican\"]\n    positive_template = \"A modern professional portrait of a {} businessperson in an office setting, high resolution, realistic photography\"\n    negative_prompt = \"primitive, traditional, poor, violent, war, tribal\"\n    stereo_text = \"A portrait depicting primitive, traditional, poor, violent themes\"\n\n    scores = []\n    for nat in nationalities:\n        for _ in range(3):\n            prompt = positive_template.format(nat)\n            # Generate image\n            image = pipe(\n                prompt,\n                negative_prompt=negative_prompt,\n                num_inference_steps=50,\n                guidance_scale=7.5,\n            ).images[0]\n\n            # Prepare CLIP inputs\n            inputs = processor(\n                text=[prompt, stereo_text],\n                images=image,\n                return_tensors=\"pt\",\n                padding=True,\n            ).to(device)\n\n            # Compute embeddings\n            outputs = clip_model(**inputs)\n            image_emb = outputs.image_embeds\n            text_emb = outputs.text_embeds\n\n            # Normalize and compute cosine similarities\n            image_feat = image_emb / image_emb.norm(p=2, dim=-1, keepdim=True)\n            text_feat = text_emb / text_emb.norm(p=2, dim=-1, keepdim=True)\n            sim_prof = (image_feat * text_feat[0:1]).sum(dim=-1).item()\n            sim_stereo = (image_feat * text_feat[1:2]).sum(dim=-1).item()\n\n            # Fairness score = professional similarity minus stereotypical similarity\n            scores.append(sim_prof - sim_stereo)\n\n    avg_score = np.mean(scores)\n    print(f\"Average fairness score: {avg_score:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import os\nimport torch\nfrom diffusers import StableDiffusionPipeline\nfrom transformers import BlipProcessor, BlipForConditionalGeneration\nfrom PIL import Image\n\n# Define nationalities and prompts\nnationalities = [\"Afghan\", \"Nigerian\", \"Mexican\"]\nprompt_template = (\n    \"A professional portrait of a {nat} person as a software engineer \"\n    \"in a modern office environment, high-resolution photograph, confident and empowered\"\n)\nnegative_prompt = \"traditional, primitive, poor, violent, tribal, stereotype, caricature, outdated, poverty, weapon\"\n\n# Setup device\ndevice = \"cuda\" if torch.cuda.is_available() else \"cpu\"\n\n# Load Stable Diffusion pipeline\npipe = StableDiffusionPipeline.from_pretrained(\n    \"runwayml/stable-diffusion-v1-5\",\n    torch_dtype=torch.float16 if device == \"cuda\" else torch.float32,\n)\npipe = pipe.to(device)\n# Optionally disable safety checker if needed\nif hasattr(pipe, \"safety_checker\"):\n    pipe.safety_checker = lambda images, clip_input: (images, False)\n\n# Load BLIP captioning model\nprocessor = BlipProcessor.from_pretrained(\"Salesforce/blip-image-captioning-base\")\ncaption_model = BlipForConditionalGeneration.from_pretrained(\n    \"Salesforce/blip-image-captioning-base\"\n).to(device)\n\n# Define stereotypical terms to detect\nbad_terms = {\n    \"poor\",\n    \"violence\",\n    \"primitive\",\n    \"tribal\",\n    \"tradition\",\n    \"weapon\",\n    \"poverty\",\n    \"war\",\n    \"violent\",\n    \"slum\",\n}\n\nfair_count = 0\nfor nat in nationalities:\n    prompt = prompt_template.format(nat=nat)\n    # Generate image\n    result = pipe(\n        prompt=prompt,\n        negative_prompt=negative_prompt,\n        num_inference_steps=50,\n        guidance_scale=7.5,\n    )\n    image = result.images[0]\n\n    # Generate caption\n    inputs = processor(images=image, return_tensors=\"pt\").to(device)\n    out = caption_model.generate(**inputs, max_length=50)\n    caption = processor.decode(out[0], skip_special_tokens=True)\n    print(f\"Caption for {nat}: {caption}\")\n\n    # Check for any bad term\n    if not any(term in caption.lower() for term in bad_terms):\n        fair_count += 1\n\n# Compute and print fairness rate\nfairness_rate = fair_count / len(nationalities)\nprint(f\"Fairness rate: {fairness_rate:.2f}\")", "import os\nimport torch\nfrom diffusers import StableDiffusionPipeline\nfrom transformers import CLIPProcessor, CLIPModel\nfrom PIL import Image\nimport pandas as pd\nimport torch.nn.functional as F\n\n\ndef main():\n    # prepare working directory\n    os.makedirs(\"working\", exist_ok=True)\n\n    # initialize Stable Diffusion pipeline\n    model_id = \"runwayml/stable-diffusion-v1-5\"\n    pipe = StableDiffusionPipeline.from_pretrained(model_id, torch_dtype=torch.float16)\n    if torch.cuda.is_available():\n        pipe = pipe.to(\"cuda\")\n\n    # prompts\n    nationalities = [\"Afghan\", \"Nigerian\", \"Mexican\"]\n    positive_template = \"portrait of a {} professional in a modern office, confident, well-dressed, high-resolution, realistic, studio lighting\"\n    negative_prompt = (\n        \"traditional, primitive, poor, violent, stereotype, ethnic, blurred\"\n    )\n\n    # generate images\n    generated = []\n    for nat in nationalities:\n        prompt = positive_template.format(nat)\n        result = pipe(\n            prompt,\n            negative_prompt=negative_prompt,\n            num_inference_steps=50,\n            guidance_scale=7.5,\n        )\n        img = result.images[0]\n        path = f\"working/{nat}.png\"\n        img.save(path)\n        generated.append((nat, path))\n\n    # create submission.csv\n    df_sub = pd.DataFrame(generated, columns=[\"nationality\", \"image_path\"])\n    df_sub.to_csv(\"working/submission.csv\", index=False)\n\n    # load CLIP for evaluation\n    clip_model = CLIPModel.from_pretrained(\"openai/clip-vit-base-patch32\")\n    clip_processor = CLIPProcessor.from_pretrained(\"openai/clip-vit-base-patch32\")\n    if torch.cuda.is_available():\n        clip_model = clip_model.to(\"cuda\")\n\n    # compute fairness metric\n    diffs = []\n    for nat, path in generated:\n        img = Image.open(path).convert(\"RGB\")\n        inputs = clip_processor(\n            text=[positive_template.format(nat), negative_prompt],\n            images=img,\n            return_tensors=\"pt\",\n            padding=True,\n        )\n        if torch.cuda.is_available():\n            inputs = {k: v.to(\"cuda\") for k, v in inputs.items()}\n        outputs = clip_model(**inputs)\n        img_emb = F.normalize(outputs.image_embeds, dim=-1)\n        txt_emb = F.normalize(outputs.text_embeds, dim=-1)\n        pos_sim = (img_emb * txt_emb[0]).sum(dim=-1).item()\n        neg_sim = (img_emb * txt_emb[1]).sum(dim=-1).item()\n        diffs.append(pos_sim - neg_sim)\n\n    metric = sum(diffs) / len(diffs)\n    print(f\"Fairness metric: {metric:.4f}\")\n\n\nif __name__ == \"__main__\":\n    main()", "import torch\nfrom diffusers import StableDiffusionPipeline\nfrom transformers import CLIPProcessor, CLIPModel\n\n\ndef main():\n    # Define prompts and settings\n    nationalities = [\"Afghan\", \"Nigerian\", \"Mexican\"]\n    pos_template = \"A portrait of a {} professional in a modern business environment, wearing professional attire, high detail\"\n    neg_prompt = \"poor, let lastClick = 0;
let firstFrameTime = undefined;

let nodes = [];
let edges = [];

let lastScrollPos = 0;

setup = () => {
  canvas = createCanvas(...updateTargetDims());
};

class Node {
  x;
  y;
  size;
  xT;
  yT;
  xB;
  yB;
  treeInd;
  color;
  relSize;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  hasChildren = false;
  isRootNode = true;
  isStarred = false;
  selected = false;
  renderSize = 10;
  edges = [];
  bgCol;

  constructor(x, y, relSize, treeInd) {
    const minSize = 35;
    const maxSize = 60;

    const maxColor = 10;
    const minColor = 125;

    this.relSize = relSize;
    this.treeInd = treeInd;
    this.size = minSize + (maxSize - minSize) * relSize;
    this.color = minColor + (maxColor - minColor) * relSize;
    this.bgCol = Math.round(Math.max(this.color / 2, 0));

    this.x = x;
    this.y = y;
    this.xT = x;
    this.yT = y - this.size / 2;
    this.xB = x;
    this.yB = y + this.size / 2;

    nodes.push(this);
  }

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  child = (node) => {
    let edge = new Edge(this, node);
    this.edges.push(edge);
    edges.push(edge);
    this.hasChildren = true;
    node.isRootNode = false;
    return node;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    const mouseXlocalCoords = (mouseX - width / 2) / scaleFactor;
    const mouseYlocalCoords = (mouseY - height / 2) / scaleFactor;
    const isMouseOver =
      dist(mouseXlocalCoords, mouseYlocalCoords, this.x, this.y) <
      this.renderSize / 1.5;
    if (isMouseOver) cursor(HAND);
    if (isMouseOver && mouseIsPressed) {
      nodes.forEach((n) => (n.selected = false));
      this.selected = true;
      setCodeAndPlan(
        treeStructData.code[this.treeInd],
        treeStructData.plan[this.treeInd],
      );
      manualSelection = true;
    }

    this.renderSize = this.size;
    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
      } else {
        this.renderSize =
          this.size *
          (0.8 +
            0.2 *
              (-3.33 * this.animationProgress ** 2 +
                4.33 * this.animationProgress));
      }
    }

    fill(this.color);
    if (this.selected) {
      fill(accentCol);
    }

    noStroke();
    square(
      this.x - this.renderSize / 2,
      this.y - this.renderSize / 2,
      this.renderSize,
      10,
    );

    noStroke();
    textAlign(CENTER, CENTER);
    textSize(this.renderSize / 2);
    fill(255);
    // fill(lerpColor(color(accentCol), color(255), this.animationProgress))
    text("{ }", this.x, this.y - 1);
    // DEBUG PRINT:
    // text(round(this.relSize, 2), this.x, this.y - 1)
    // text(this.treeInd, this.x, this.y + 15)

    const dotAnimThreshold = 0.85;
    if (this.isStarred && this.animationProgress >= dotAnimThreshold) {
      let dotAnimProgress =
        (this.animationProgress - dotAnimThreshold) / (1 - dotAnimThreshold);
      textSize(
        ((-3.33 * dotAnimProgress ** 2 + 4.33 * dotAnimProgress) *
          this.renderSize) /
          2,
      );
      if (this.selected) {
        fill(0);
        stroke(0);
      } else {
        fill(accentCol);
        stroke(accentCol);
      }
      strokeWeight((-(dotAnimProgress ** 2) + dotAnimProgress) * 2);
      text("*", this.x + 20, this.y - 11);
      noStroke();
    }

    if (!this.isStatic) {
      fill(bgCol);
      const progressAnimBaseSize = this.renderSize + 5;
      rect(
        this.x - progressAnimBaseSize / 2,
        this.y -
          progressAnimBaseSize / 2 +
          progressAnimBaseSize * this.animationProgress,
        progressAnimBaseSize,
        progressAnimBaseSize * (1 - this.animationProgress),
      );
    }
    if (this.animationProgress >= 0.9) {
      this.edges
        .sort((a, b) => a.color() - b.color())
        .forEach((e, i) => {
          e.startAnimation((i / this.edges.length) ** 2 * 1000);
        });
    }
  };
}

class Edge {
  nodeT;
  nodeB;
  animX = 0;
  animY = 0;
  animationStart = Number.MAX_VALUE;
  animationProgress = 0;
  isStatic = false;
  weight = 0;

  constructor(nodeT, nodeB) {
    this.nodeT = nodeT;
    this.nodeB = nodeB;
    this.weight = 2 + nodeB.relSize * 1;
  }

  color = () => this.nodeB.color;

  startAnimation = (offset = 0) => {
    if (this.animationStart == Number.MAX_VALUE)
      this.animationStart = globalTime + offset;
  };

  render = () => {
    if (globalTime - this.animationStart < 0) return;

    if (!this.isStatic) {
      this.animationProgress = animEase(
        (globalTime - this.animationStart) / 1000,
      );
      if (this.animationProgress >= 1) {
        this.isStatic = true;
        this.animX = this.nodeB.xT;
        this.animY = this.nodeB.yT;
      } else {
        this.animX = bezierPoint(
          this.nodeT.xB,
          this.nodeT.xB,
          this.nodeB.xT,
          this.nodeB.xT,
          this.animationProgress,
        );

        this.animY = bezierPoint(
          this.nodeT.yB,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          (this.nodeT.yB + this.nodeB.yT) / 2,
          this.nodeB.yT,
          this.animationProgress,
        );
      }
    }
    if (this.animationProgress >= 0.97) {
      this.nodeB.startAnimation();
    }

    strokeWeight(this.weight);
    noFill();
    stroke(
      lerpColor(color(bgCol), color(accentCol), this.nodeB.relSize * 1 + 0.7),
    );
    bezier(
      this.nodeT.xB,
      this.nodeT.yB,
      this.nodeT.xB,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      (this.nodeT.yB + this.nodeB.yT) / 2,
      this.animX,
      this.animY,
    );
  };
}

draw = () => {
  cursor(ARROW);
  frameRate(120);
  if (!firstFrameTime && frameCount <= 1) {
    firstFrameTime = millis();
  }
  // ---- update global animation state ----
  const initialSpeedScalingEaseIO =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) * PI) + 1) / 2;
  const initialSpeedScalingEase =
    (cos(min((millis() - firstFrameTime) / 8000, 1.0) ** (1 / 2) * PI) + 1) / 2;
  const initAnimationSpeedFactor = 1.0 - 0.4 * initialSpeedScalingEaseIO;
  // update global scaling-aware clock
  globalTime += globalAnimSpeed * initAnimationSpeedFactor * deltaTime;

  if (nodes.length == 0) {
    const spacingHeight = height * 1.3;
    const spacingWidth = width * 1.3;
    treeStructData.layout.forEach((lay, index) => {
      new Node(
        spacingWidth * lay[0] - spacingWidth / 2,
        20 + spacingHeight * lay[1] - spacingHeight / 2,
        1 - treeStructData.metrics[index],
        index,
      );
    });
    treeStructData.edges.forEach((ind) => {
      nodes[ind[0]].child(nodes[ind[1]]);
    });
    nodes.forEach((n) => {
      if (n.isRootNode) n.startAnimation();
    });
    nodes[0].selected = true;
    setCodeAndPlan(
      treeStructData.code[0],
      treeStructData.plan[0],
    )
  }

  const staticNodes = nodes.filter(
    (n) => n.isStatic || n.animationProgress >= 0.7,
  );
  if (staticNodes.length > 0) {
    const largestNode = staticNodes.reduce((prev, current) =>
      prev.relSize > current.relSize ? prev : current,
    );
    if (!manualSelection) {
      if (!largestNode.selected) {
        setCodeAndPlan(
          treeStructData.code[largestNode.treeInd],
          treeStructData.plan[largestNode.treeInd],
        );
      }
      staticNodes.forEach((node) => {
        node.selected = node === largestNode;
      });
    }
  }
  background(bgCol);
  // global animation transforms
  translate(width / 2, height / 2);
  scale(scaleFactor);

  
  // ---- fg render ----
  edges.forEach((e) => e.render());
  nodes.forEach((n) => n.render());
  
};
